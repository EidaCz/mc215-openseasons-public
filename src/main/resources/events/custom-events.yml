# OpenSeasons – custom events
#
# As many events as you like: dated (from a date to a date), weekly (one day of the week) and daily (on
# every day change). They run by the game date of a world; running ones show in /season and in
# %mc215os_active_events% (with display-event: true, by the name from name).
#
# Date: dd/mm/yyyy (once), dd/mm (every year) or just a day, e.g. 5 (every month); with
# american-date-format in calendar.yml mm/dd. Day of the week by its name from calendar.yml (week-days),
# in English (Monday … Sunday) or by its order from 1.
#
# commands: a line starting with '/' is a console command, any other is a message to the players of the
# world, NONE nothing. Placeholders %day%, %month%, %month_asname%, %year%, %weekday%, %season%, %world%
# and with PlaceholderAPI the others too. disabled-worlds: worlds where the event does not run.
#
# The examples are turned off.

config-version: 1

custom-events:
  dated-events:
    spooky-october:
      enabled: false
      name: '&6Spooky October'
      display-event: true
      times:
        event-start:
          date: 1/10
        event-stop:
          date: 1/11
      commands:
        start:
          - '&aOctober has begun, monsters grow stronger at night.'
          - '/difficulty hard'
        stop:
          - '/difficulty normal'
  weekly-events:
    quiet-sunday:
      enabled: false
      name: '&aQuiet Sunday'
      display-event: true
      day: Sunday
      commands:
        start:
          - '&6It is %weekday%, %month_asname% %day%, %year%, a day of rest: whoever dies keeps their items.'
          - '/gamerule keep_inventory true'
        stop:
          - '/gamerule keep_inventory false'
  daily-events:
    morning-news:
      enabled: false
      commands:
        - '&3It is midnight, &f%weekday%, %month_asname% %day%, year %year% &3begins.'
        - '&3Season: &f%season%'
