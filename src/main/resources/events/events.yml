# OpenSeasons – built-in events (Christmas, New Year, Halloween, Easter)
#
# Events run by the game date of a world (the same as the seasons) and start and end at game midnight.
# Date dd/mm (every year), dd/mm/yyyy (once) or just a day (every month); with american-date-format in
# calendar.yml mm/dd. The end is inclusive: New Year 1/1 – 1/1 is one day.
#
# commands.start / commands.stop: a line starting with '/' is a console command, any other line is a
# message to the players of the world (colours &a, &#RRGGBB), NONE nothing. Placeholders %day%, %month%,
# %month_asname%, %year%, %weekday%, %season%, %world% and with PlaceholderAPI the others too.

config-version: 1

dated-events:
  christmas:
    enabled: true
    name: '&cChristmas'
    # show in /season and placeholders
    display-event: true
    disabled-worlds: [ NONE ]
    times:
      event-start:
        date: 25/12
      event-stop:
        date: 28/12
    # sparks in the sky above players at night
    night-particles: true
    # decorated spruces around players (baubles, lights and a star made of displays, the world does not change)
    christmas-trees:
      enabled: true
    commands:
      start:
        - '&cChristmas &ahas begun!'
        - '&aPresents appear in villages and around them, just unwrap them.'
      stop:
        - NONE
    # presents: near villagers and around players, unwrapped by a click; one random loot item
    presents:
      enabled: true
      # smallest distance of places where presents appeared during one Christmas (chunks)
      chunk-distance-between-spawns: 10
      # min-max:ITEM or count:ITEM
      loot:
        - 2-8:EXPERIENCE_BOTTLE
        - 6-20:FIREWORK_ROCKET
        - 1-12:FIRE_CHARGE
        - 2-16:POTATO
        - 2-8:CARROT
        - 1-16:COAL
        - 1-16:SNOWBALL
        - 2-12:SWEET_BERRIES
        - 6-16:COOKIE
        - 1-2:ENDER_PEARL
        - 4-12:BAKED_POTATO
        - 2-8:BOOK
        - 4-12:BREAD
        - 1:DIAMOND
        - 1:GOLD_INGOT
        - 2-8:COOKED_RABBIT
        - 2-8:COOKED_MUTTON
        - 2-8:COOKED_BEEF
        - 2-8:COOKED_CHICKEN
        - 2-8:COOKED_PORKCHOP
        - 2-8:COOKED_SALMON
        - 1-3:GOLDEN_APPLE
        - 2-8:GOLDEN_CARROT
        - 1:LEATHER_HELMET
        - 2-16:SPECTRAL_ARROW
        - 1:CLOCK
        - 1-3:MAGMA_CREAM
        - 1-3:NETHER_WART
        - 1-3:BLAZE_ROD
        - 1-6:GOLD_NUGGET
        - 2-8:COOKED_COD
        - 1-4:SPRUCE_SAPLING

  newyear:
    enabled: true
    name: '&cNew Year'
    display-event: true
    disabled-worlds: [ NONE ]
    times:
      event-start:
        date: 1/1
      event-stop:
        date: 1/1
    # firework boxes around players at night, most right after midnight; the rockets hurt nobody
    spawn-firework-boxes: true
    # smallest distance between boxes (blocks)
    min-distance-between-firework: 34
    commands:
      start:
        - '&cHappy New Year!'
        - '&aThe villagers celebrate, fireworks fly over the landscape at night.'
      stop:
        - NONE

  halloween:
    enabled: true
    name: '&6Halloween'
    display-event: true
    disabled-worlds: [ NONE ]
    times:
      event-start:
        date: 31/10
      event-stop:
        date: 2/11
    commands:
      start:
        - '&6Halloween &ahas begun!'
        - '&aStrange monsters roam outside at night, be careful.'
      stop:
        - NONE
    # changes of naturally spawned monsters; chance 0–1 (0.07 = 7 %)
    # flames flicker around changed monsters
    play-particles-around-halloween-mobs: true
    # witches throw extra potions with one of the effects
    witch-extra-potions:
      enabled: true
      effects:
        - BLINDNESS
        - NAUSEA
        - WITHER
        - MINING_FATIGUE
        - SLOW_FALLING
        - LEVITATION
    # a monster has a twin
    duplicating-mobs:
      enabled: true
      spawn-chance: 0.07
    invisible-mobs:
      enabled: true
      spawn-chance: 0.07
    fast-mobs:
      enabled: true
      spawn-chance: 0.07
    # skeletons shoot burning arrows
    flame-skeletons:
      enabled: true
      spawn-chance: 0.3
    armored-mobs:
      enabled: true
      spawn-chance: 0.25
    zombies-hold-pie:
      enabled: true
      spawn-chance: 0.3
    # at night on the surface a vindicator instead of the monster
    vindicators-at-night:
      enabled: true
      spawn-chance: 0.05
    # a carved pumpkin or jack o'lantern on the head of zombies and skeletons with an empty head
    pumpkin-heads:
      enabled: true
      spawn-chance: 0.35
    # bats around players at night (chance per check once in 10 s, at most 6 near a player)
    more-bats:
      enabled: true
      spawn-chance: 0.5
    # an extra spider next to a naturally spawned monster on the surface
    more-spiders:
      enabled: true
      spawn-chance: 0.15

  easter:
    enabled: true
    name: '&dEaster'
    display-event: true
    disabled-worlds: [ NONE ]
    times:
      event-start:
        date: 20/4
      event-stop:
        date: 24/4
    # at night a killer bunny sometimes appears instead of a zombie, skeleton, creeper or spider
    spawn-killer-bunnies: true
    killer-bunny-spawn-rate: 0.1
    commands:
      start:
        - '&dEaster &ahas begun!'
        - '&aEggs are hidden across the landscape. Watch out for killer bunnies at night.'
      stop:
        - NONE
    # eggs around players, unwrapped by a click; one random loot item
    easter-eggs:
      enabled: true
      chunk-distance-between-spawns: 4
      loot:
        - 3-6:COOKIE
        - 2-16:CARROT
        - 1:RABBIT_FOOT
        - 1:CAKE
        - 1-20:LEATHER
        - 2-24:GOLDEN_CARROT
        - 2-48:POTATO
        - 2-48:WHEAT
        - 2-16:GOLDEN_APPLE
        - 2-48:BEETROOT
        - 1:SADDLE
        - 1:NAME_TAG
        - 2-10:EGG
        - 2-10:MELON_SEEDS
        - 2-10:PUMPKIN_SEEDS
        - 2-16:BLUE_DYE
        - 2-16:RED_DYE
        - 2-16:YELLOW_DYE
        - 2-32:BAMBOO
        - 2-32:OAK_LOG
        - 1:HONEY_BOTTLE
        - 1-8:HONEYCOMB
        - 1-8:CACTUS
        - 1-12:SLIME_BALL
        - 1-5:HAY_BLOCK
        - 1:MUSHROOM_STEW
        - 1-12:GOLD_INGOT
        - 1-6:DIAMOND
