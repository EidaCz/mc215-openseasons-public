name: OpenSeasons
version: '${project.version}'
main: cz.eida.minecraft.openseasons.OpenSeasonsPlugin
api-version: '26.2'
authors: [ EidaCz ]
description: '${project.description}'
website: '${project.url}'
# Multiverse for worlds loaded before the state is taken over, packetevents for landscape colours on
# the client, WorldGuard (with WorldEdit or FAWE): season flags (season and block changes by region)
softdepend: [ PlaceholderAPI, Multiverse-Core, packetevents, WorldGuard, WorldEdit ]
commands:
  openseasons:
    description: OpenSeasons administration
    usage: /openseasons reload | info [world] | set <season> [world] | setdate <date> [world] | nextseason [world] | disable [world] | pausetime [world] | colors [<season> <percent> [fog] | off] [world] | restore <world> [radius] [confirm] | region [world x z] | help | debug <phenomenon> [player]
    aliases: [ mc215os ]
    permission: mc215os.admin
  season:
    description: Season, date and time of a world
    usage: /season [world]
  toggleseasoncolors:
    description: Turns the season landscape colours off or on just for you
    usage: /toggleseasoncolors
  toggleseasonparticles:
    description: Turns the season particles off or on just for you
    usage: /toggleseasonparticles
permissions:
  mc215os.admin:
    description: OpenSeasons administration (/openseasons)
    default: op
  mc215os.getinfo:
    description: /season
    default: op
  mc215os.toggleseasons:
    description: /toggleseasoncolors
    default: true
  mc215os.toggleparticles:
    description: /toggleseasonparticles
    default: true
