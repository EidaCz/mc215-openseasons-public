# OpenSeasons – display names (overlay)
#
# Overrides the names of months and days from calendar.yml and the season names from lang.yml for
# display: placeholders, /season, /openseasons info and the API for other plugins. The calendar itself
# does not change, so dates and calendar.yml stay as they are. Months and days are looked up by their
# name in the calendar (case does not matter); what is missing here stays by the calendar.
#
# Example (uncomment and edit), e.g. for a translation or short names:
#
# months:
#   January: Jan
#   February: Feb
#
# weekdays:
#   Monday: Mon
#   Tuesday: Tue
#
# seasons:
#   FALL: Autumn

config-version: 1
