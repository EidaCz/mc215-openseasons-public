config-version: 1

# Seasonal plants in the world. The main switches of the basic plants are in config.yml (modify-blocks,
# flower-chance-in-spring, max-berrybushes-per-chunk, regrow-grass-everywhere, spawn-mushrooms-in-fall,
# generate-leaf-litter, spawn-leaf-litter-under …); here are their chances and limits and the further
# seasonal plants.
#
# chance        chance of a plant at a tried spot when a chunk is visited
# max-per-chunk most plants of that kind placed by OpenSeasons in one chunk

# radius of chunks around a player where plants appear (loaded chunks only, nothing is loaded)
chunk-radius: 8
# how many spots of a chunk are tried in one visit
samples-per-chunk: 6
# most removed plants (end of their season) in one chunk visit
removals-per-visit: 64

# spring; the chance is flower-chance-in-spring in config.yml
flowers:
  max-per-chunk: 12
# spring and summer, dies off in winter (regrow-grass-everywhere)
grass:
  chance: 10%
  max-per-chunk: 24
# autumn, in the shade of trees (spawn-mushrooms-in-fall)
mushrooms:
  chance: 4%
  max-per-chunk: 6
# summer, until winter; the limit is max-berrybushes-per-chunk for all bushes in a chunk
berry-bushes:
  chance: 1%
# autumn, under the leaves from spawn-leaf-litter-under (generate-leaf-litter)
leaf-litter:
  chance: 30%
  max-per-chunk: 40

# --- further seasonal plants ---

# summer, near spruces
firefly-bush:
  enabled: true
  chance: 1.5%
  max-per-chunk: 2
# spring (lasts until the end of summer), wet meadows and birch forests
wildflowers:
  enabled: true
  chance: 2%
  max-per-chunk: 6
# spring, under cherry trees
pink-petals:
  enabled: true
  chance: 4%
  max-per-chunk: 6
# summer and autumn, hot biomes (savanna, desert, badlands)
dry-grass:
  enabled: true
  chance: 4%
  max-per-chunk: 8
# summer and autumn, temperate biomes
bush:
  enabled: true
  chance: 0.5%
  max-per-chunk: 2
# spring, on cacti
cactus-flower:
  enabled: true
  chance: 15%
  max-per-chunk: 3
# autumn, pumpkins on temperate meadows (they vanish with winter like the other seasonal plants)
pumpkins:
  enabled: true
  chance: 0.3%
  max-per-chunk: 1
