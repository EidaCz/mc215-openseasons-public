# Custom biomes (TERRALITH_WARPED_MESA).
includes: terralith:warped_mesa
show-snow-instead-of-rain:
  spring: false
  summer: false
  fall: false
  winter: false
# colours RRGGBB or NONE (unchanged); treecolor (leaves) one colour or five for patches
colors:
  spring:
    skycolor: NONE
    watercolor: NONE
    waterfogcolor: NONE
    grasscolor: NONE
    treecolor: NONE
    fogcolor: NONE
  summer:
    skycolor: '84BDE8'
    watercolor: '43D5EE'
    waterfogcolor: '43D5EE'
    grasscolor: '8F6E4D'
    treecolor: '77AB2F'
    fogcolor: NONE
  fall:
    skycolor: NONE
    watercolor: NONE
    waterfogcolor: NONE
    grasscolor: NONE
    treecolor: NONE
    fogcolor: NONE
  winter:
    skycolor: '8E7CC3'
    watercolor: '8E7CC3'
    waterfogcolor: '8E7CC3'
    grasscolor: NONE
    treecolor: NONE
    fogcolor: NONE
