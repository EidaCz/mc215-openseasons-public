# Custom biomes (TERRALITH_BADLANDS).
includes: terralith:painted_mountains, terralith:red_oasis, terralith:white_mesa
show-snow-instead-of-rain:
  spring: false
  summer: false
  fall: false
  winter: false
# colours RRGGBB or NONE (unchanged); treecolor (leaves) one colour or five for patches
colors:
  spring:
    skycolor: '78A7FF'
    watercolor: '4397EC'
    waterfogcolor: '4397EC'
    grasscolor: NONE
    treecolor: 'FFB0E9'
    fogcolor: NONE
  summer:
    skycolor: '84BDE8'
    watercolor: '43D5EE'
    waterfogcolor: '43D5EE'
    grasscolor: '8F6E4D'
    treecolor: '77AB2F'
    fogcolor: NONE
  fall:
    skycolor: '89919A'
    watercolor: '617B64'
    waterfogcolor: '617B64'
    grasscolor: NONE
    treecolor: 'E8962A, E8962A, AEA42A, 6BA941, 60A17B'
    fogcolor: NONE
  winter:
    skycolor: 'D2DEFF'
    watercolor: '3938C9'
    waterfogcolor: '3938C9'
    grasscolor: '79C05A'
    treecolor: '79C05A'
    fogcolor: NONE
