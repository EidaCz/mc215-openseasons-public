# Custom biomes (TERRALITH_SIBERIAN_TAIGA).
includes: terralith:siberian_taiga
show-snow-instead-of-rain:
  spring: false
  summer: false
  fall: false
  winter: true
# colours RRGGBB or NONE (unchanged); treecolor (leaves) one colour or five for patches
colors:
  spring:
    skycolor: '78A7FF'
    watercolor: '4397EC'
    waterfogcolor: '4397EC'
    grasscolor: '84A24E'
    treecolor: '8EB14E'
    fogcolor: NONE
  summer:
    skycolor: '84BDE8'
    watercolor: '43D5EE'
    waterfogcolor: '43D5EE'
    grasscolor: '84A24E'
    treecolor: '30BB0B'
    fogcolor: NONE
  fall:
    skycolor: '89919A'
    watercolor: '617B64'
    waterfogcolor: '617B64'
    grasscolor: NONE
    treecolor: NONE
    fogcolor: NONE
  winter:
    skycolor: 'D2DEFF'
    watercolor: '216FC4'
    waterfogcolor: '216FC4'
    grasscolor: 'B8D0E1'
    treecolor: 'B8D0E1'
    fogcolor: 'A6D1FF'
