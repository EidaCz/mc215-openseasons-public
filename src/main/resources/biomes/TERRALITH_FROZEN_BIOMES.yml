# Custom biomes (TERRALITH_FROZEN_BIOMES).
includes: terralith:alpine_grove, terralith:cold_shrubland, terralith:frozen_cliffs, terralith:glacial_chasm, terralith:gravel_desert, terralith:ice_marsh, terralith:rocky_mountains, terralith:rocky_shrubland, terralith:scarlet_mountains, terralith:siberian_grove, terralith:snowy_badlands, terralith:snowy_maple_forest, terralith:snowy_shield, terralith:wintry_forest
show-snow-instead-of-rain:
  spring: true
  summer: true
  fall: true
  winter: true
# colours RRGGBB or NONE (unchanged); treecolor (leaves) one colour or five for patches
colors:
  spring:
    skycolor: NONE
    watercolor: NONE
    waterfogcolor: NONE
    grasscolor: NONE
    treecolor: NONE
    fogcolor: NONE
  summer:
    skycolor: '84BDE8'
    watercolor: '3F76E4'
    waterfogcolor: '3F76E4'
    grasscolor: '91BD59'
    treecolor: '59AE30'
    fogcolor: NONE
  fall:
    skycolor: NONE
    watercolor: NONE
    waterfogcolor: NONE
    grasscolor: NONE
    treecolor: NONE
    fogcolor: NONE
  winter:
    skycolor: 'D2DEFF'
    watercolor: '216FC4'
    waterfogcolor: '216FC4'
    grasscolor: 'B8D0E1'
    treecolor: 'B8D0E1'
    fogcolor: 'A6D1FF'
