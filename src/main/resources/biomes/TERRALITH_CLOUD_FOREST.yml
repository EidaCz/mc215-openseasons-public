# Custom biomes (TERRALITH_CLOUD_FOREST).
includes: terralith:cloud_forest
show-snow-instead-of-rain:
  spring: false
  summer: false
  fall: false
  winter: true
# colours RRGGBB or NONE (unchanged); treecolor (leaves) one colour or five for patches
colors:
  spring:
    skycolor: NONE
    watercolor: NONE
    waterfogcolor: NONE
    grasscolor: NONE
    treecolor: NONE
    fogcolor: NONE
  summer:
    skycolor: NONE
    watercolor: NONE
    waterfogcolor: NONE
    grasscolor: NONE
    treecolor: '97C08B'
    fogcolor: '99A9BB'
  fall:
    skycolor: NONE
    watercolor: NONE
    waterfogcolor: NONE
    grasscolor: '74BB80'
    treecolor: 'A5C29C, A5C29C, BCC9B7, B0D6A4, BCC9B7'
    fogcolor: 'D3DBE5'
  winter:
    skycolor: NONE
    watercolor: NONE
    waterfogcolor: NONE
    grasscolor: '9DC3A4'
    treecolor: '9ABEA0'
    fogcolor: 'FFFFFF'
