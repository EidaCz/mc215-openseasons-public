# Custom biomes (TERRALITH_CAVES).
includes: terralith:cave/andesite_caves, terralith:cave/deep_caves, terralith:cave/diorite_caves, terralith:cave/frostfire_caves, terralith:cave/fungal_caves, terralith:cave/granite_caves, terralith:cave/infested_caves, terralith:cave/mantle_caves, terralith:cave/thermal_caves, terralith:cave/tuff_caves
show-snow-instead-of-rain:
  spring: false
  summer: false
  fall: false
  winter: true
# colours RRGGBB or NONE (unchanged); treecolor (leaves) one colour or five for patches
colors:
  spring:
    skycolor: NONE
    watercolor: NONE
    waterfogcolor: NONE
    grasscolor: NONE
    treecolor: NONE
    fogcolor: NONE
  summer:
    skycolor: NONE
    watercolor: NONE
    waterfogcolor: NONE
    grasscolor: NONE
    treecolor: NONE
    fogcolor: NONE
  fall:
    skycolor: NONE
    watercolor: NONE
    waterfogcolor: NONE
    grasscolor: NONE
    treecolor: NONE
    fogcolor: NONE
  winter:
    skycolor: NONE
    watercolor: NONE
    waterfogcolor: NONE
    grasscolor: NONE
    treecolor: NONE
    fogcolor: NONE
