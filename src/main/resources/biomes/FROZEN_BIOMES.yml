# Vanilla biome group FROZEN_BIOMES.
includes: minecraft:snowy_beach, minecraft:snowy_taiga, minecraft:snowy_plains, minecraft:frozen_river, minecraft:ice_spikes, minecraft:frozen_ocean, minecraft:deep_frozen_ocean
show-snow-instead-of-rain:
  spring: true
  summer: true
  fall: true
  winter: true
# colours RRGGBB or NONE (unchanged); treecolor (leaves) one colour or five for patches
colors:
  spring:
    skycolor: NONE
    watercolor: NONE
    waterfogcolor: NONE
    grasscolor: NONE
    treecolor: NONE
    fogcolor: NONE
  summer:
    skycolor: '84BDE8'
    watercolor: '3F76E4'
    waterfogcolor: '3F76E4'
    grasscolor: '91BD59'
    treecolor: '59AE30'
    fogcolor: NONE
  fall:
    skycolor: NONE
    watercolor: NONE
    waterfogcolor: NONE
    grasscolor: NONE
    treecolor: NONE
    fogcolor: NONE
  winter:
    skycolor: NONE
    watercolor: NONE
    waterfogcolor: NONE
    grasscolor: NONE
    treecolor: NONE
    fogcolor: NONE
